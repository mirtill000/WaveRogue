[env:cardputer]
; Pinned to the arduino-esp32 2.x / ESP-IDF 4.4 generation. Newer
; espressif32 platform releases jump to arduino-esp32 3.x (IDF 5.x),
; which renamed/removed internal I2C driver struct fields
; (i2c_periph_signal_t no longer has `.module`) that M5GFX/M5Unified
; still reference as of the versions pinned below - building against
; IDF 5.x fails with "has no member named 'module'" in M5GFX's
; common.cpp. If you deliberately want a newer core, you'll also need
; newer M5GFX/M5Unified/M5Cardputer releases that support it.
platform = espressif32 @ 6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    m5stack/M5Cardputer @ ^1.0.3
    jgromes/RadioLib @ ^6.4.2
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.0.4
    SD
    SPI
    FS
    WiFi
; Deliberately NOT listing m5stack/M5GFX or m5stack/M5Unified here:
; M5Cardputer already depends on specific, mutually-compatible versions
; of both in its own library.json. Pinning them again at this level made
; PlatformIO's resolver satisfy OUR (looser) version ranges instead,
; pulling a newer M5Unified that removed the Button_Class::getButton()
; API this M5Cardputer release calls - "has no member named 'getButton'".
; Let M5Cardputer manage its own M5GFX/M5Unified versions transitively.

; NFC Tools (nfc_reader.cpp) needs the ST25R3916 + NFC-RFAL Arduino
; libraries (rfal_nfc.h, rfal_mf1.h, ...) - an ESP32-validated fork:
; https://github.com/wilson-elechouse/ST25R3916 (v1.1.1 / NFC-RFAL v1.0.2).
; That repo holds TWO separate library folders at its root
; (NFC-RFAL/ and ST25R3916_ELECHOUSE/), which a single lib_deps git URL
; is not guaranteed to resolve into two usable libraries, so both are
; vendored directly into this project's lib/ directory instead
; (lib/NFC-RFAL/, lib/ST25R3916_ELECHOUSE/ - each has its own
; library.properties, so PlatformIO picks them up automatically with no
; lib_deps entry needed here). See README.md's "NFC Tools" section.
